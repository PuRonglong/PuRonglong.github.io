# Site settings 配置站点
title: "蒲荣龙的博客"
description: "很高兴能在这里与你分享我对生活和技术的思考。"
keyword: "蒲荣龙, 蒲荣龙的独立博客, 蒲荣龙的博客, 蒲荣龙"
url: "https://www.puronglong.com" # your host

# if you don't need baseurl, you should leave this value blank.
baseurl: ""

# 时区：GitHub Pages 在 UTC 构建，显式声明避免文章日期整体偏移一天
timezone: Asia/Shanghai

# Navigation links（已外置到 _data/nav.yml，便于维护）

# Footer
footer:
  since: 2014

# Author 配置博主信息
author: "蒲荣龙"
nickname: "蒲荣龙"
bio: "我有一只12年的博客"
introduction: "在这里分享我对世界的看法、思考、记录"
avatar: "https://puronglong-blog-image.oss-cn-beijing.aliyuncs.com/2019-12-29-13.jpg"

# Search
search: true

# Night mode
nightMode: false

# Comments 评论功能
comments:
  disqus: false
  disqus_url: ""

# MathJax 公式支持（按文章启用：在文章 front matter 加 `mathjax: true`）

# Share
social-share: false
social-share-items: ["wechat", "weibo", "douban", "twitter"]

# theme color 主题皮肤
theme-color: "default" # pink or default

# Post header background patterns (when the post no cover): circuitBoard, overlappingCircles, food, glamorous, ticTacToe, seaOfClouds
postPatterns: "circuitBoard"

# SNS settings 配置社交网站
# url: email, weibo, zhihu, twitter, instagram, juejin, github, douban, facebook, dribble, uicn, jianshu, medium, linkedin
sns:
  weibo: "//weibo.com/puronglong"
  instagram: "//www.instagram.com/puronglong93"
  douban: "https://www.douban.com/people/puronglong"

# Tags 设置标签
recommend-tags: true # whether or not display recommend-tags on the sidebar
recommend-condition-size: 12 # a tag will be recommended if the size of it is more than this value

# Build settings
paginate: 15
paginate_path: "page:num"
exclude:
  [
    "node_modules",
    ".gitignore",
    "README.md",
    "LICENSE",
    ".jshintrc",
  ]

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# RSS
RSS: false

# Permalink
# See: https://github.com/kaeyleo/jekyll-theme-H2O/issues/35
permalink: /:year/:month/:day/:title.html

# Plugins
plugins: [jekyll-paginate, jekyll-sitemap, jekyll-seo-tag, jekyll-feed]

excerpt_separator: "<!-- more -->"

# 6 个分析报告页（shs/jjs/jls/gjjjs/zxs/sjs）仅供本人访问，不希望被搜索引擎索引：
# 已在这 6 个页的 front matter 各自设 `sitemap: false`（jekyll-sitemap 1.4.0 仅支持按页 front matter 排除，不支持 config 的 exclude 列表）。
