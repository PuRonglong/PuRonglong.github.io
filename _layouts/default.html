<!DOCTYPE html>
<html lang="zh-CN">
{% include head.html %}
<body>
    <input id="nm-switch" type="hidden" value="{{ site.nightMode }}">
    <div class="visible">
      {{ content }}
    </div>
    {% assign ver = site.time | date: '%Y%m%d%H%M%S' %}
    {% if content contains '<pre' or page.prism %}
    <script defer src="{{ '/assets/js/prism.js?v=' | append: ver | relative_url }}"></script>
    {% endif %}
    <script defer src="{{ '/assets/js/index.min.js?v=' | append: ver | relative_url }}"></script>
    {% include back-to-top.html %}
</body>
</html>
