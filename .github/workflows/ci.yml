name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 统计页数据新鲜度校验：_data/blog_stats.json 是离线生成的快照，本地 pre-commit 钩子负责自动更新；
      # 但钩子位于 .git/hooks/（不随仓库分发），换机器或 git commit --no-verify 时会漏跑，故在此兜底。
      # 比对时剔除 meta.generated_at（每次生成都会变），其余字段逐项比较。
      - name: Verify blog stats are up to date
        run: python3 dev/check_stats_fresh.py

      # GitHub Pages 线上用 Jekyll 3.9 工具链构建，这里用官方 github-pages gem
      # 保持与线上完全一致的依赖版本，避免"本地 Jekyll 4 通过、线上 3.9 出问题"。
      - name: Set up Ruby 3.0 (compatible with github-pages gem)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Install github-pages gem (mirrors Pages toolchain)
        run: gem install github-pages --no-document

      - name: Build site with Jekyll 3.9 (Pages toolchain)
        run: |
          # 项目 Gemfile 锁定 Jekyll 4.4.1（本地预览用），构建前临时移开，
          # 避免 jekyll 3.9 启动时 Bundler 加载 Jekyll 4 造成版本混乱。
          mv Gemfile Gemfile.bak
          if [ -f Gemfile.lock ]; then mv Gemfile.lock Gemfile.lock.bak; fi
          jekyll build --trace
          status=$?
          mv -f Gemfile.bak Gemfile
          if [ -f Gemfile.lock.bak ]; then mv -f Gemfile.lock.bak Gemfile.lock; fi
          exit $status

      # jekyll-paginate 1.1.0 在 Jekyll 4 下会"静默失效"（构建成功但首页文章列表为空）。
      # 用与线上一致的 3.9 构建后，断言首页确实渲染出了文章条目，失败即报错。
      - name: Verify homepage renders posts (catch paginate silent failure)
        run: |
          post_count=$(find _posts -name '*.md' | wc -l)
          echo "posts in _posts/: $post_count"
          if [ "$post_count" -eq 0 ]; then
            echo "::error::no posts found in _posts/, nothing to verify"
            exit 1
          fi
          items=$(grep -c 'class="article-item"' _site/index.html || true)
          echo "article items rendered on homepage: $items"
          if [ "$items" -eq 0 ]; then
            echo "::error::homepage renders 0 articles — jekyll-paginate silently failed (empty post list)"
            exit 1
          fi
          echo "OK: homepage renders $items posts"
