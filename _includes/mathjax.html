{% if page.mathjax or page.content contains '$$' %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script>
    (function () {
      var cdns = [
        "https://cdn.staticfile.net/mathjax/3.2.2/es5/tex-mml-chtml.js",
        "https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js",
        "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
      ];
      (function load(i) {
        if (i >= cdns.length) return;
        if (window.MathJax && window.MathJax.startup) return;
        var s = document.createElement("script");
        s.src = cdns[i];
        s.async = true;
        s.onerror = function () { load(i + 1); };
        document.head.appendChild(s);
      })(0);
    })();
  </script>
{% endif %}
