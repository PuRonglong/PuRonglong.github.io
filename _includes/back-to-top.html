<button id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
    <path fill="currentColor" d="M12 4l-8 8h5v8h6v-8h5z"></path>
  </svg>
</button>
<style>
  /* 显隐由主脚本中的弹簧驱动（transform/opacity），此处只定义静止态与 .show 兜底 */
  #back-to-top {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(49, 153, 219, .9);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
    opacity: 0;
    transform: translateY(8px) scale(.9);
    pointer-events: none;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .22);
    z-index: 9999;
  }
  #back-to-top:hover {
    background: #3199db;
    transform: translateY(-2px);
  }
  /* 按下即时反馈（优先级高于 hover） */
  #back-to-top:active {
    transform: translateY(-1px) scale(.92);
  }
  #back-to-top:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  #back-to-top.show {
    visibility: visible;
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  /* 减动效：退化为 200ms 透明度过渡 */
  @media (prefers-reduced-motion: reduce) {
    #back-to-top {
      transition: opacity .2s ease, transform .2s ease;
    }
    #back-to-top.show {
      transform: translateY(0) scale(1);
    }
  }
  @media (max-width: 600px) {
    #back-to-top {
      right: 14px;
      bottom: 14px;
      width: 40px;
      height: 40px;
    }
  }
</style>
