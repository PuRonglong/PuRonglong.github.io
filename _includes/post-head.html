<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="author"  content="{{ site.author }}">
    <meta name="description" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="keywords"  content="{% if page.tags.size > 0 %}{% for tag in page.tags  %}{{ tag }}{% if forloop.last == false %}, {% endif %}{% endfor %}{% endif %}">
    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | prepend: site.url }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <link rel="stylesheet" href="{{ '/assets/vendor/normalize.min.css' | relative_url }}">
    {% if page.prism or page.content contains '<pre' %}
    <link rel="stylesheet" href="{{ '/assets/css/prism.css' | relative_url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/app.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/github-markdown.css' | relative_url }}">
    <!-- jQuery：非阻塞 defer 加载（国内 CDN 优先；主源失败才逐级回退 bootcdn → jsdelivr） -->
    <link rel="preconnect" href="https://cdn.staticfile.net" crossorigin>
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script defer src="https://cdn.staticfile.net/jquery/3.2.1/jquery.min.js" onerror="window.__jqFallback()"></script>
    <script>
      window.__jqFallback = function () {
        if (window.jQuery) return;
        var cdns = [
          'https://cdn.bootcdn.net/ajax/libs/jquery/3.2.1/jquery.min.js',
          'https://cdn.jsdelivr.net/npm/jquery@3.2.1/dist/jquery.min.js'
        ];
        (function load(i) {
          if (i >= cdns.length || window.jQuery) return;
          var s = document.createElement('script');
          s.src = cdns[i];
          s.onerror = function () { load(i + 1); };
          document.head.appendChild(s);
        })(0);
      };
    </script>
	{% if page.mathjax or page.content contains '$$' %}
	{% include mathjax.html %}
	{% endif %}
    {% include anchor.html %}
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('{{ '/sw.js' | relative_url }}').catch(function () {});
      });
    }
    </script>
</head>
