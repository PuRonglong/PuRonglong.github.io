<header class="g-header">
    <div class="g-logo">
        <a href="{{ "/" | relative_url }}" aria-label="首页">
            <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M9.5 9v6M14.5 9v6M9.5 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </a>
    </div>
    <i id="menu-toggle" class="iconfont icon-menu" role="button" tabindex="0" aria-label="切换导航菜单"></i>
    {% if site.showNightToggle != false %}
    <button id="nm-toggle" type="button" aria-label="切换夜间模式" title="切换夜间模式">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.5-9.4A8.96 8.96 0 0 0 12 3z"/>
        </svg>
    </button>
    {% endif %}
    <nav class="g-nav">
        <ul>
            {% for i in site.data.nav %}
            <li><a href="{{ i[1] }}">{{ i[0] }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</header>
