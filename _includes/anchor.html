<!-- 锚点样式已并入 assets/css/bundle.min.css（避免每页重复输出） -->
<script>
    (function () {
        function addAnchors() {
            var md = document.querySelector(".markdown-body");
            if (!md) return;
            var nodes = md.querySelectorAll("h1,h2,h3");
            for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                var anchor = document.createElement("a");
                var anchorIcon = document.createElement("span");
                anchorIcon.setAttribute("class", "anchor-icon");
                anchorIcon.setAttribute("aria-hidden", "true");
                anchorIcon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>';
                anchor.setAttribute("class", "anchor");
                anchor.setAttribute("href", "#" + node.getAttribute("id"));
                anchor.onmouseover = function() { this.style.opacity = "0.4"; };
                anchor.onmouseout = function() { this.style.opacity = "0"; };
                anchor.appendChild(anchorIcon);
                node.appendChild(anchor);
            }
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", addAnchors);
        } else {
            addAnchors();
        }
    })();
</script>
